# ─────────────────────────────────────────────────────────────────────────────
# Family App — DEVELOPER stack.
#
# Backing services only. The API and the PWA run on the HOST via `pnpm dev`, so
# you keep tsx watch, Vite HMR and a real debugger. Ports are therefore
# published to the host — this file must never be used on the VDI.
#
#     docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
#     (or `make dev-up`)
#
# Matching host-side env for `backend/.env`:
#     DATABASE_URL=postgres://family:family@localhost:5432/family
#     REDIS_URL=redis://:family@localhost:6379
#
# NO MAIL CATCHER. D9/D10 rule out SMTP entirely — notifications go out over
# Web Push (VAPID) and the Telegram bot, and nothing in the codebase can send
# an email. A mailpit service would be a container nobody ever opens. If email
# is ever added, add mailpit here and set SMTP_HOST=localhost:1025.
# ─────────────────────────────────────────────────────────────────────────────

name: family-dev

volumes:
  pg_data_dev:
    name: family_pg_data_dev
  redis_data_dev:
    name: family_redis_data_dev

services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    # Bound to loopback on purpose: a dev database on 0.0.0.0 with a trivial
    # password is reachable from every other machine on the café wifi.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family}
      POSTGRES_DB: ${POSTGRES_DB:-family}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    # A password even locally, so REDIS_URL has the same shape in every
    # environment and nobody discovers auth for the first time in production.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-family}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-family}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
